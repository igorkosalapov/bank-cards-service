server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bankcards}
    username: ${DB_USER:bankcards}
    password: ${DB_PASSWORD:bankcards}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/migration/db.changelog-master.yaml

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXP_MIN:60}
  issuer: ${JWT_ISSUER:bankcards-api}

crypto:
  aes-key-base64: ${AES_KEY_BASE64}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
